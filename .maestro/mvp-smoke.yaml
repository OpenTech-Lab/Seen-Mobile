appId: com.icyanstudio.spot
---
- launchApp

# The ALTCHA proof-of-work gate (lib/widgets/altcha_gate_screen.dart) solves
# ~50k SHA-256 hashes in an isolate before onboarding renders. A debug/JIT
# build on an emulator is far slower than the "< 2s" the source comment claims.
- extendedWaitUntil:
    visible: "Get started"
    timeout: 60000
- takeScreenshot: onboarding
- tapOn: "Get started"

# UGC community-terms gate (lib/widgets/ugc_terms_gate.dart) sits between
# onboarding and identity creation.
- extendedWaitUntil:
    visible: "Agree to the community terms"
    timeout: 30000
- takeScreenshot: community-terms

# The Checkbox and the agreement wording are SIBLINGS in a Row, so the label
# carries no gesture detector: tapping the text reports COMPLETED while
# toggling nothing, and "Agree and continue" stays disabled (onPressed: null
# until _hasAgreed). The box itself has to be hit — and its position is NOT
# stable across platforms: the label wraps to more lines on iOS, moving the
# box from ~66% to ~77% of screen height, so any single hard-coded point can
# only ever work on one of the two.
#
# What actually works is the CASCADE below, not any single selector. Each step
# is guarded on "Agree and continue" still reporting disabled, and the whole
# thing is closed out by an explicit assertion that it became enabled — so the
# flow detects for itself whether consent registered instead of assuming a tap
# landed. A bare tap ALWAYS reports COMPLETED even when it hits nothing, which
# is the trap that made the original failure look like a broken identity
# screen three steps later.
#
# Attempt 1, leftOf the label: measured NO-OP on iOS in run 32673882134 — it
# reported COMPLETED while the button stayed disabled, so the guard below still
# fired. Kept as a harmless best-effort first try (it may work on Android) but
# do NOT rely on it. Why it fails is unproven: the run-32644516742 hierarchy
# shows the checkbox [44,646][92,694] as the only node ending before x=100 on
# the label's row, so it should be unambiguous. A passing run writes no
# hierarchy dump, so there is nothing to diagnose it from yet.
- tapOn:
    leftOf:
      text: "I agree to #seen.*"
    optional: true

# Attempt 2, iOS coordinate. This is the step that actually checks the box on
# iOS (confirmed in run 32673882134). The label wraps to more lines there,
# putting the 48x48 Checkbox at ~17%,77% of a 402x874 screen.
- runFlow:
    when:
      notVisible:
        text: "Agree and continue"
        enabled: true
    commands:
      - tapOn:
          point: "17%,77%"

# Attempt 3, Android coordinate — the original working value. SKIPPED on iOS
# because attempt 2 already enabled the button, which is exactly the point of
# the guard: the wrong-platform coordinate can never fire and toggle consent
# back OFF.
- runFlow:
    when:
      notVisible:
        text: "Agree and continue"
        enabled: true
    commands:
      - tapOn:
          point: "16%,66%"

# Assert consent actually registered, so a failure here names the checkbox
# instead of surfacing three steps later as a missing "Generate new identity".
- assertVisible:
    text: "Agree and continue"
    enabled: true
- takeScreenshot: community-terms-accepted
- tapOn: "Agree and continue"

- extendedWaitUntil:
    visible: "Generate new identity"
    timeout: 30000
- takeScreenshot: create-identity
